<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 별점표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* 표지 크기 — 여기 숫자만 바꾸면 전체가 같이 커지고 작아진다 */
  --tile-w: 183px;      /* 홈 가로줄 */
  --feed-w: 207px;      /* 피드 카드 */
  --sheet-w: 520px;     /* 상세 창 너비 */
  --detail-w: 200px;    /* 상세 표지 */

  --bg:#14121a; --surface:#1e1a26; --raise:#2a2434;
  --fg:#efecf4; --fg-dim:#9a94a8; --score:#f5b93a;
  --line:rgba(239,236,244,.10); --line-2:rgba(239,236,244,.06);
}
[data-theme="light"]{
  --bg:#faf9fb; --surface:#fff; --raise:#f0edf3;
  --fg:#1a1725; --fg-dim:#6b6480; --score:#b8791a;
  --line:rgba(26,23,37,.13); --line-2:rgba(26,23,37,.07);
}
html[data-adult="1"]{ --score:#ff5c7a; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.num{font-family:'Instrument Serif',serif;font-feature-settings:"tnum"}

.seg{position:relative;display:inline-flex;background:var(--raise);border-radius:999px;padding:3px}
.seg .ind{position:absolute;top:3px;bottom:3px;background:var(--fg);border-radius:999px;
  transition:transform .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1)}
.seg button{position:relative;z-index:1;background:none;border:0;cursor:pointer;font:inherit;
  font-size:13.5px;padding:6px 15px;border-radius:999px;color:var(--fg-dim);transition:color .2s;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-selected="true"]{color:var(--bg);font-weight:500}
.seg.lg button{font-size:15px;padding:7px 19px}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:13px 24px;max-width:1400px;margin:0 auto}
.brand{font-family:'Instrument Serif',serif;font-size:23px;white-space:nowrap;cursor:pointer}
.brand em{font-style:italic;color:var(--score)}
.spacer{flex:1}
.icon{background:none;border:1px solid var(--line);color:var(--fg-dim);width:34px;height:34px;
  border-radius:999px;cursor:pointer;font-size:15px;display:grid;place-items:center;flex:0 0 auto}
.icon:hover{color:var(--fg);border-color:var(--fg-dim)}
.login{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:14px;
  padding:7px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
.login:hover{background:var(--raise)}
.searchbox input{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;color:var(--fg);font:inherit;font-size:13.5px;width:160px;transition:width .2s}
.searchbox input:focus{outline:0;border-color:var(--fg-dim);width:210px}

.adultbar{background:color-mix(in srgb,var(--score) 14%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--score) 35%,transparent);display:none}
html[data-adult="1"] .adultbar{display:block}
.adultbar div{max-width:1400px;margin:0 auto;padding:9px 24px;display:flex;align-items:center;gap:12px;
  font-size:13.5px;color:var(--score)}
.adultbar b{font-weight:600}
.adultbar button{margin-left:auto;background:var(--score);color:#14121a;border:0;border-radius:7px;
  padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}

.frow{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.frow.a{padding-bottom:12px}
.frow.b{padding-bottom:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.vline{width:1px;height:20px;background:var(--line)}
.glabel{font-size:11.5px;color:var(--fg-dim);margin-right:2px}
.cond{display:flex;gap:6px}
.cond button{background:none;border:1px solid var(--line);color:var(--fg-dim);font:inherit;
  font-size:13px;padding:5px 11px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px}
.cond button:hover{color:var(--fg)}
.cond button[aria-pressed="true"]{border-color:var(--score);color:var(--score);
  background:color-mix(in srgb,var(--score) 12%,transparent)}
.cond button::before{content:"";width:5px;height:5px;border-radius:1px;border:1px solid currentColor;opacity:.55}
.cond button[aria-pressed="true"]::before{background:currentColor;opacity:1}
.rangebox{display:flex;align-items:center;gap:9px}
.rangebox input{width:98px;accent-color:var(--score)}
.rangebox b{font-family:'Instrument Serif',serif;font-size:17px;color:var(--score);font-weight:400;min-width:26px}
.gchips{display:flex;gap:6px;flex-wrap:wrap}
.gchips button{background:none;border:1px solid var(--line);color:var(--fg-dim);font:inherit;
  font-size:13px;padding:5px 13px;border-radius:999px;cursor:pointer}
.gchips button:hover{color:var(--fg)}
.gchips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{background:none;border:1px solid var(--line);color:var(--fg-dim);font:inherit;
  font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pchips button:hover{color:var(--fg)}
.pchips i{width:7px;height:7px;border-radius:999px}
.pchips button[aria-pressed="true"]{color:var(--pc);border-color:currentColor;
  background:color-mix(in srgb,var(--pc) 13%,transparent)}
.wchips{display:flex;gap:6px}
.wchips button{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:none;
  color:var(--fg-dim);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.wchips button:hover{color:var(--fg)}
.wchips button[aria-pressed="true"]{background:var(--wc);color:#14121a;border-color:var(--wc)}

/* ══ 표지 — 크기 절대 안 변한다 ══ */
.cover{position:relative;width:100%;aspect-ratio:3/4;border-radius:5px;overflow:hidden;
  background:var(--raise);flex:0 0 auto}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover>.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden}
.cover>.ph span{font-size:clamp(14px,1.35vw,20px);font-weight:600;line-height:1.4;text-align:center;
  color:var(--fg);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:6;
  -webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:4px 9px;
  border-radius:4px;background:var(--score);color:#14121a;z-index:2}
.badge.end{background:rgba(0,0,0,.66);color:#fff}

main{max-width:1400px;margin:0 auto;padding:26px 0 40px}
.row{margin-bottom:40px}
.rowhead{display:flex;align-items:baseline;gap:11px;padding:0 24px 13px}
.rowhead h2{font-size:19px;font-weight:600}
.rowhead i{font-style:normal;font-size:13px;color:var(--fg-dim)}
.rail{display:flex;gap:17px;overflow-x:auto;padding:0 24px 6px;align-items:flex-start}
.rail::-webkit-scrollbar{height:5px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.tile{flex:0 0 var(--tile-w);width:var(--tile-w);cursor:pointer;border:0;background:none;padding:0;text-align:left}
.tile .cover{transition:transform .18s}
.tile:hover .cover{transform:translateY(-4px)}
.tile h3{font-size:15.5px;font-weight:500;margin-top:11px;color:var(--fg);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.tile .sc{font-size:19px;color:var(--score);margin-top:3px}

.feed{max-width:960px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:16px}
.shuffbar{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface);
  border:1px dashed var(--line);border-radius:9px}
.shuffbar p{font-size:13.5px;color:var(--fg-dim);flex:1;line-height:1.5}
.shuffbar b{color:var(--fg);font-weight:500}
.shuffbtn{background:var(--score);color:#14121a;border:0;border-radius:8px;padding:9px 17px;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.post{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.postin{display:grid;grid-template-columns:var(--feed-w) 1fr;gap:24px;padding:22px;align-items:start}
.postin>div:first-child{cursor:pointer}
.pmeta h3{font-size:20px;font-weight:600;line-height:1.3;word-break:keep-all}
.pmeta .by{font-size:13.5px;color:var(--fg-dim);margin-top:5px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tag{font-size:12px;color:var(--fg-dim);background:var(--raise);padding:3px 9px;border-radius:4px}
.body{font-size:14.5px;line-height:1.72;margin-top:13px}
.foot{display:flex;align-items:center;gap:11px;padding:12px 20px;border-top:1px solid var(--line);
  font-size:13px;color:var(--fg-dim);flex-wrap:wrap}
.foot .fill{flex:1}
.fav{background:none;border:0;color:var(--fg-dim);cursor:pointer;font-size:16px;padding:2px}
.fav[aria-pressed="true"]{color:var(--score)}
.wtag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;color:#14121a}

.score{display:flex;align-items:flex-end;gap:7px;margin-top:14px}
.score .v{font-size:44px;line-height:.9;color:var(--score)}
.score .of{font-size:14px;color:var(--fg-dim);padding-bottom:5px}
.score .cnt{font-size:12px;color:var(--fg-dim);padding-bottom:6px;margin-left:2px}
.scale{margin-top:9px;max-width:210px}
.track{position:relative;height:3px;background:var(--line);border-radius:2px}
.track i{position:absolute;top:-3px;width:3px;height:9px;background:var(--score);border-radius:2px}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg-dim);margin-top:5px}
.score.sm .v{font-size:26px} .score.sm{margin-top:8px}

.spo{background:var(--raise);border-radius:3px;padding:0 3px;cursor:pointer;filter:blur(4.5px);
  user-select:none;transition:filter .2s}
.spo:hover{filter:blur(3.5px)}
.spo.on{filter:none;background:color-mix(in srgb,var(--score) 17%,transparent);cursor:auto}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:80;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(var(--sheet-w),100%);z-index:90;background:var(--bg);
  border-left:1px solid var(--line);overflow-y:auto;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sheet.on{transform:none}
.sheettop{position:sticky;top:0;background:var(--bg);padding:16px 24px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;z-index:2}
.sheettop b{font-size:15px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{padding:24px}
/* 표지 왼쪽 · 정보 오른쪽 */
.hero{display:grid;grid-template-columns:var(--detail-w) 1fr;gap:26px;align-items:start}
.carousel{position:relative;width:var(--detail-w)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:999px;
  border:0;cursor:pointer;background:rgba(0,0,0,.62);color:#fff;font-size:14px;display:grid;place-items:center;z-index:3}
.arrow.l{left:6px} .arrow.r{right:6px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:9px}
.dots i{width:5px;height:5px;border-radius:999px;background:var(--line)}
.dots i.on{background:var(--score)}
h1.t{font-size:27px;font-weight:600;line-height:1.28;word-break:keep-all}
.sub{font-size:14px;color:var(--fg-dim);margin-top:6px;line-height:1.55}
.facts{display:grid;grid-template-columns:60px 1fr;gap:7px 12px;margin-top:16px;font-size:13.5px}
.facts dt{color:var(--fg-dim);font-size:12.5px}
.facts a{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.rev{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}
.revhead{display:flex;align-items:center;gap:10px}
.block{margin-top:16px}
.block h4{font-size:12.5px;color:var(--fg-dim);font-weight:500;margin-bottom:7px}
.block p{font-size:15px;line-height:1.78;white-space:pre-wrap}
.quote{font-family:'Instrument Serif',serif;font-style:italic;font-size:18px;line-height:1.6;
  border-left:2px solid var(--score);padding-left:15px;margin-top:18px}
.cmts{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
.cmts h4{font-size:13px;color:var(--fg-dim);font-weight:500;margin-bottom:14px}
.cmt{display:flex;gap:10px;margin-bottom:13px;font-size:14.5px;align-items:baseline}
.cmt b{font-weight:600;color:var(--fg-dim);flex:0 0 auto}
.cmt .del{margin-left:auto;background:none;border:0;color:var(--fg-dim);cursor:pointer;font-size:12px;opacity:.6}
.cmtbox{display:flex;gap:8px;margin-top:16px}
.cmtbox input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;color:var(--fg);font:inherit;font-size:14px}
.cmtbox input:focus{outline:2px solid var(--score);outline-offset:-1px}
.cmtbox button{background:var(--fg);color:var(--bg);border:0;border-radius:7px;padding:0 17px;
  font:inherit;font-size:14px;cursor:pointer}
.cmtbox button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--fg-dim);padding:90px 20px;line-height:1.8}

/* 중간 너비 — 표지는 크게 두되 여백만 줄인다 */
@media(max-width:1100px){
  :root{ --tile-w:230px; --feed-w:260px; --sheet-w:680px; --detail-w:250px; }
}
@media(max-width:860px){
  :root{ --tile-w:200px; --feed-w:220px; --detail-w:220px; }
}
@media(max-width:760px){
  :root{ --tile-w:190px; --detail-w:200px; }
  .bar{gap:10px;padding:12px 16px;flex-wrap:wrap}
  .brand{font-size:19px}
  .seg.lg button{font-size:13.5px;padding:6px 13px}
  .searchbox{order:9;width:100%}
  .searchbox input,.searchbox input:focus{width:100%}
  .frow{padding-left:16px;padding-right:16px;gap:11px}
  .frow.a,.frow.b{overflow-x:auto;flex-wrap:nowrap}
  .vline{flex:0 0 auto}
  .rowhead,.rail{padding-left:16px;padding-right:16px}
  .feed{padding:0 16px}
  .postin{grid-template-columns:1fr;gap:16px;padding:16px}
  .postin>div:first-child{max-width:250px}
  .sheetbody{padding:20px 16px}
  .hero{grid-template-columns:1fr;gap:18px}
  .carousel{width:min(250px,70%)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand" id="brand">웹툰 <em>별점표</em></div>
    <div class="seg lg" id="segView">
      <div class="ind"></div>
      <button aria-selected="true">홈</button>
      <button aria-selected="false">피드</button>
      <button aria-selected="false">랜덤</button>
    </div>
    <div class="spacer"></div>
    <div class="searchbox"><input id="q" placeholder="제목 · 작가 · 태그"></div>
    <button class="icon" id="tbtn" title="테마 바꾸기">◐</button>
    <button class="login" id="loginBtn">로그인</button>
  </div>

  <div class="adultbar"><div>
    <b>성인 웹툰</b><span>만 보고 있다</span>
    <button id="exit19">일반으로 돌아가기</button>
  </div></div>

  <div class="frow a">
    <div class="seg" id="segStat">
      <div class="ind"></div>
      <button aria-selected="true">전체</button>
      <button aria-selected="false">연재중</button>
      <button aria-selected="false">완결</button>
    </div>
    <div class="vline"></div>
    <div class="cond" id="conds"></div>
    <div class="vline"></div>
    <div class="rangebox">
      <span class="glabel">별점</span>
      <input type="range" id="minr" min="0" max="5" step="0.1" value="3">
      <b id="mv">3.0</b><span class="glabel">이상</span>
    </div>
  </div>

  <div class="frow b">
    <span class="glabel">장르</span><div class="gchips" id="fg"></div>
    <div class="vline"></div>
    <span class="glabel">플랫폼</span><div class="pchips" id="fp"></div>
    <div class="vline"></div>
    <span class="glabel">글쓴이</span><div class="wchips" id="fw"></div>
  </div>
</header>

<main id="main"><p class="empty">불러오는 중…</p></main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet"><div id="sheetin"></div></aside>

<script src="config.js"></script>
<script>
(async function(){
const C = window.CONFIG;
const TODAY = new Date();
const ADULT = C.adultGenre || "19";

/* ── Supabase (설정 없으면 건너뜀) ── */
let sb = null, me = null;
if (C.supabase.url && C.supabase.anonKey) {
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = createClient(C.supabase.url, C.supabase.anonKey);
    const { data } = await sb.auth.getSession();
    me = data.session?.user ?? null;
    sb.auth.onAuthStateChange((_e, s) => { me = s?.user ?? null; paintLogin(); });
  } catch(e){ sb = null; }
}
function paintLogin(){
  const b = document.getElementById("loginBtn");
  if (!sb) { b.textContent = "관리자"; b.onclick = () => location.href = "admin.html"; return; }
  if (me) { b.textContent = (me.user_metadata?.name || "나").split(" ")[0] + " · 로그아웃";
            b.onclick = async () => { await sb.auth.signOut(); location.reload(); }; }
  else { b.textContent = "구글로 로그인";
         b.onclick = () => sb.auth.signInWithOAuth({ provider:"google",
           options:{ redirectTo: location.href.split("#")[0] } }); }
}

/* ── 데이터 ── */
let DATA = [];
try {
  const r = await fetch("data/webtoons.json?" + Date.now());
  DATA = (await r.json()).items;
} catch(e) {
  document.getElementById("main").innerHTML =
    `<p class="empty">데이터를 못 불러왔다.<br>data/webtoons.json 이 있는지 확인해보자.</p>`;
}

const GENRES = C.genres.filter(g => g !== ADULT);
const PLATFORMS = Object.keys(C.platforms);
const WRITERS = C.admins.map(a => a.id);
const WCOLOR = Object.fromEntries(C.admins.map(a => [a.id, a.color]));
const PCOLOR = Object.fromEntries(Object.entries(C.platforms).map(([k,v]) => [k, v.color]));
const CONDS = [["신작","6개월 이내에 시작한 작품"],["50화 이하","짧아서 따라잡기 쉬운 작품"],["즐겨찾기","내가 별 표시한 작품"]];

let view="home", stat="전체", minScore=3, query="", adult=false;
let sel={genre:new Set(),platform:new Set(),writer:new Set()}, cond=new Set(), shuffled=[];

let favs = new Set(JSON.parse(localStorage.getItem("favs") || "[]"));
async function loadFavs(){
  if (!sb || !me) return;
  const local = favs; // 로그인 전 이 기기에 모아둔 즐겨찾기
  const { data } = await sb.from("favorites").select("webtoon_id").eq("user_id", me.id);
  const server = new Set((data||[]).map(r => r.webtoon_id));
  const toUpload = [...local].filter(id => !server.has(id));
  if (toUpload.length){
    try {
      const { error } = await sb.from("favorites")
        .upsert(toUpload.map(id => ({ user_id: me.id, webtoon_id: id })), { onConflict: "user_id,webtoon_id" });
      if (!error) toUpload.forEach(id => server.add(id));
    } catch(e) {}
  }
  favs = server;
}
async function toggleFav(id){
  const was = favs.has(id);
  was ? favs.delete(id) : favs.add(id);
  if (sb && me) {
    try {
      const { error } = was
        ? await sb.from("favorites").delete().match({ user_id: me.id, webtoon_id: id })
        : await sb.from("favorites").insert({ user_id: me.id, webtoon_id: id });
      if (error) throw error;
    } catch(e) {
      was ? favs.add(id) : favs.delete(id); // 실패하면 되돌린다
    }
  } else localStorage.setItem("favs", JSON.stringify([...favs]));
}

const isNew = w => w.start && (TODAY - new Date(w.start)) / 86400000 <= C.newDays;
const isEnd = w => (w.status||"").includes("완결");
/* 글쓴이 필터가 켜져 있으면 그 사람 리뷰만으로 평균·개수를 계산한다 */
const reviewsFor = w => sel.writer.size ? w.reviews.filter(r=>sel.writer.has(r.writer)) : w.reviews;
const avg = w => { const rv = reviewsFor(w); return rv.length ? rv.reduce((a,r)=>a+r.rating,0)/rv.length : 0; };
const avgRounded = w => Math.round(avg(w)*10)/10;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const names = w => (w.authors && w.authors.length) ? w.authors.join(" · ") : (w.author || "");

function slide(id,i){
  const box=document.getElementById(id), btns=box.querySelectorAll("button");
  btns.forEach((b,n)=>b.setAttribute("aria-selected", n===i));
  const b=btns[i], ind=box.querySelector(".ind");
  ind.style.width=b.offsetWidth+"px";
  ind.style.transform=`translateX(${b.offsetLeft-3}px)`;
}
function shuffle(){
  const l = DATA.filter(pass);
  for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];}
  shuffled=l; render(); scrollTo({top:0,behavior:"smooth"});
}
const after = () => view==="random" ? shuffle() : render();

/* 표지 — 이미지가 있으면 이미지, 없거나 깨지면 제목만. 크기는 항상 같다 */
function cover(w,i=0,badge=true){
  let bd="";
  if (badge){
    if (isEnd(w)) bd=`<span class="badge end">${esc(w.status)}</span>`;
    else if (isNew(w)) bd=`<span class="badge">신작</span>`;
  }
  const src = w.covers?.[i];
  const ph = `<div class="ph"><span>${esc(w.title)}</span></div>`;
  const img = src ? `<img src="${esc(src)}" alt="" loading="lazy"
      onerror="this.remove()">` : "";
  return `<div class="cover">${ph}${img}${bd}</div>`;
}
function stars(v,n,sm){
  return `<div class="score${sm?" sm":""}"><div class="v num">${v.toFixed(1)}</div><div class="of">/ 5.0</div>
    ${n>1?`<div class="cnt">${n}명 평균</div>`:""}</div>
  <div class="scale"><div class="track"><i style="left:${Math.max(0,Math.min(100,v/5*100)).toFixed(1)}%"></i></div>
  <div class="ticks"><span>0.0</span><span>2.5</span><span>5.0</span></div></div>`;
}
const spo = t => esc(t).replace(/\|\|([^|]+?)\|\|/g,
  (m,x)=>`<span class="spo" onclick="this.classList.add('on')" title="스포일러 — 눌러서 보기">${x}</span>`);

function pass(w){
  if ((w.genres||[]).includes(ADULT) !== adult) return false;
  if (avgRounded(w) < minScore - 1e-9) return false;
  if (stat==="연재중" && isEnd(w)) return false;
  if (stat==="완결" && !isEnd(w)) return false;
  if (cond.has("신작") && !isNew(w)) return false;
  if (cond.has("50화 이하") && (!w.episodes || w.episodes > 50)) return false;
  if (cond.has("즐겨찾기") && !favs.has(w.id)) return false;
  if (sel.genre.size && !(w.genres||[]).some(g=>sel.genre.has(g))) return false;
  if (sel.platform.size && !sel.platform.has(w.platform)) return false;
  if (sel.writer.size && !w.reviews.some(r=>sel.writer.has(r.writer))) return false;
  if (query) {
    const hay = (w.title+" "+names(w)+" "+w.tags.join(" ")).toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}

function card(w){
  const rv = reviewsFor(w);
  const r0 = rv[0] || {};
  return `<article class="post">
    <div class="postin">
      <div data-open="${w.id}">${cover(w)}</div>
      <div class="pmeta">
        <h3>${esc(w.title)}</h3>
        <div class="by">${esc(names(w)) || "작가 미기재"}</div>
        ${stars(avg(w), rv.length)}
        <div class="tags">
          <span class="tag" style="color:${PCOLOR[w.platform]||""}">${esc(w.platform)}</span>
          ${(w.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}
          ${w.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}
        </div>
        <div class="body">${spo(r0.summary)}</div>
      </div>
    </div>
    <div class="foot">
      <span>${isEnd(w) ? `${esc(w.status)}${w.episodes?` · ${w.episodes}화`:""}`
                       : `${w.weekday?esc(w.weekday)+"요일 · ":""}${w.episodes||"?"}화`}</span>
      <span class="fill"></span>
      ${w.reviews.map(r=>`<span class="wtag" style="background:${WCOLOR[r.writer]||"#888"}">${esc(r.writer)}</span>`).join("")}
      <button class="fav" aria-pressed="${favs.has(w.id)}" data-fav="${w.id}">★</button>
      <button class="fav" data-open="${w.id}">💬</button>
    </div></article>`;
}

function rowHtml(title, items){
  items = [...items].sort((a,b)=>avg(b)-avg(a));
  return `<section class="row">
    <div class="rowhead"><h2>${esc(title)}</h2><i>${items.length}편</i></div>
    <div class="rail">${items.map(w=>`<button class="tile" data-open="${w.id}">
      ${cover(w)}<h3>${esc(w.title)}</h3><div class="sc num">${avg(w).toFixed(1)}</div></button>`).join("")}</div>
  </section>`;
}

function render(){
  const m = document.getElementById("main"), list = DATA.filter(pass);
  if (!list.length){
    let msg = adult ? "성인 웹툰으로 등록된 작품이 없다.<br>관리자 화면에서 장르를 19로 두면 여기에 모인다."
      : "조건에 맞는 웹툰이 없다.<br>별점을 낮추거나 조건을 하나 꺼보자.";
    if (!adult && cond.has("신작") && !DATA.some(w=>w.start))
      msg = "신작으로 표시된 작품이 없다.<br>연재 시작일이 입력된 작품이 아직 없어서 그렇다 — 관리자 화면에서 시작일을 채워보자.";
    m.innerHTML = `<p class="empty">${msg}</p>`;
    return;
  }
  if (view==="home"){
    const groups = adult ? [ADULT] : GENRES;
    const seen = new Set();
    let html = groups.map(g=>{
      const r = list.filter(w=>(w.genres||[]).includes(g));
      r.forEach(w=>seen.add(w.id));
      return r.length ? rowHtml(g===ADULT?"성인 웹툰":g, r) : "";
    }).join("");
    if (!adult){
      const leftover = list.filter(w=>!seen.has(w.id));
      if (leftover.length) html += rowHtml("기타", leftover);
    }
    m.innerHTML = html || `<p class="empty">조건에 맞는 웹툰이 없다.</p>`;
  } else if (view==="feed"){
    list.sort((a,b)=>avg(b)-avg(a));
    m.innerHTML = `<div class="feed">${list.map(card).join("")}</div>`;
  } else {
    m.innerHTML = `<div class="feed">
      <div class="shuffbar">
        <p><b>${shuffled.length}편</b>을 무작위로 섞었다. 뭘 볼지 못 정하겠으면 위에서부터 내려보자.</p>
        <button class="shuffbtn" id="reshuffle">다시 섞기</button>
      </div>${shuffled.map(card).join("")}</div>`;
  }
}

/* ── 상세: 표지 왼쪽 · 정보 오른쪽 ── */
let ci = 0, cur = null;
async function open_(id){
  const w = DATA.find(x=>x.id===id); if(!w) return;
  cur = w; ci = 0;
  document.getElementById("sheetin").innerHTML = `
  <div class="sheettop"><button class="icon" id="closeBtn">✕</button><b>${esc(w.title)}</b>
    <button class="fav" aria-pressed="${favs.has(w.id)}" data-fav="${w.id}" style="font-size:19px">★</button></div>
  <div class="sheetbody">
    <div class="hero">
      <div class="carousel" id="car"></div>
      <div>
        <h1 class="t">${esc(w.title)}</h1>
        <div class="sub">${esc(names(w)) || "작가 미기재"}</div>
        ${stars(avg(w), reviewsFor(w).length, true)}
        <dl class="facts">
          <dt>플랫폼</dt><dd style="color:${PCOLOR[w.platform]||""}">${esc(w.platform)}</dd>
          <dt>연재</dt><dd>${isEnd(w) ? `${esc(w.status)}${w.episodes?` · 총 ${w.episodes}화`:""}`
            : `${w.weekday?esc(w.weekday)+"요일 · ":""}${w.episodes||"?"}화`}</dd>
          <dt>시작</dt><dd>${w.start ? esc(w.start).replace(/-/g,". ") + (isNew(w)?" · 신작":"") : "모름"}</dd>
          <dt>장르</dt><dd>${(w.genres||[]).map(esc).join(" · ")} ${w.tags.map(t=>"#"+esc(t)).join(" ")}</dd>
          ${w.url?`<dt>보러가기</dt><dd><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.platform)}에서 열기</a></dd>`:""}
        </dl>
      </div>
    </div>
    ${w.reviews.map(r=>`<div class="rev">
      <div class="revhead"><span class="wtag" style="background:${WCOLOR[r.writer]||"#888"}">${esc(r.writer)}</span>
        <span class="num" style="font-size:22px;color:var(--score)">${r.rating.toFixed(1)}</span></div>
      ${r.summary?`<div class="block"><h4>별점 근거와 줄거리</h4><p>${spo(r.summary)}</p></div>`:""}
      ${r.review?`<div class="block"><h4>하고 싶은 말</h4><p>${spo(r.review)}</p></div>`:""}
      ${r.note?`<div class="quote">${esc(r.note)}</div>`:""}
    </div>`).join("")}
    ${(w.comments||[]).length?`<div class="cmts"><h4>옮겨온 댓글</h4>
      ${w.comments.map(c=>`<div class="cmt"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>`:""}
    <div class="cmts" id="cmts"><h4>댓글</h4><p style="font-size:14px;color:var(--fg-dim)">불러오는 중…</p></div>
  </div>`;
  car();
  document.getElementById("closeBtn").onclick = close_;
  document.getElementById("scrim").classList.add("on");
  document.getElementById("sheet").classList.add("on");
  loadComments(w.id);
}
function car(){
  const w = cur, n = Math.max(1, w.covers?.length || 0);
  document.getElementById("car").innerHTML = cover(w, ci, false) + (n>1 ? `
    <button class="arrow l" data-car="-1">‹</button><button class="arrow r" data-car="1">›</button>
    <div class="dots">${Array.from({length:n},(_,i)=>`<i class="${i===ci?"on":""}"></i>`).join("")}</div>` : "");
}
function close_(){
  document.getElementById("scrim").classList.remove("on");
  document.getElementById("sheet").classList.remove("on");
}

async function loadComments(id){
  const box = document.getElementById("cmts");
  if (!sb){ box.innerHTML = `<h4>댓글</h4><p style="font-size:14px;color:var(--fg-dim)">
      댓글은 Supabase를 연결하면 켜진다.</p>`; return; }
  const { data, error } = await sb.from("comments").select("*")
    .eq("webtoon_id", id).order("created_at", { ascending: true });
  const rows = error ? [] : (data || []);
  box.innerHTML = `<h4>댓글 ${rows.length}</h4>
    ${rows.map(c=>`<div class="cmt"><b>${esc(c.user_name)}</b><span>${esc(c.body)}</span>
      ${me && c.user_id===me.id ? `<button class="del" data-del="${c.id}">지우기</button>` : ""}</div>`).join("")
      || `<p style="font-size:14px;color:var(--fg-dim)">첫 댓글을 남겨보자.</p>`}
    <div class="cmtbox">
      <input id="cin" placeholder="${me ? "한 줄 남기기" : "로그인하면 쓸 수 있다"}" ${me?"":"disabled"}>
      <button id="cbtn" ${me?"":"disabled"}>올리기</button>
    </div>`;
  if (me){
    const inp = document.getElementById("cin"), btn = document.getElementById("cbtn");
    const send = async () => {
      const body = inp.value.trim(); if(!body) return;
      btn.disabled = true;
      await sb.from("comments").insert({ webtoon_id: id, user_id: me.id,
        user_name: me.user_metadata?.name || "익명", body });
      inp.value = ""; loadComments(id);
    };
    btn.onclick = send;
    inp.onkeydown = e => { if(e.key==="Enter") send(); };
  }
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await sb.from("comments").delete().eq("id", b.dataset.del); loadComments(id);
  });
}

function drawChips(){
  const gs = adult ? [ADULT] : GENRES;
  document.getElementById("fg").innerHTML = gs.map(v=>
    `<button aria-pressed="${sel.genre.has(v)}" data-k="genre" data-v="${esc(v)}">${esc(v==ADULT?"성인":v)}</button>`).join("");
  document.getElementById("fp").innerHTML = PLATFORMS.map(v=>
    `<button style="--pc:${PCOLOR[v]}" aria-pressed="${sel.platform.has(v)}" data-k="platform" data-v="${esc(v)}">
      <i style="background:${PCOLOR[v]}"></i>${esc(v)}</button>`).join("");
  document.getElementById("fw").innerHTML = WRITERS.map(v=>
    `<button style="--wc:${WCOLOR[v]}" aria-pressed="${sel.writer.has(v)}" data-k="writer" data-v="${esc(v)}"
      title="글쓴이 ${esc(v)}">${esc(v)}</button>`).join("");
  document.getElementById("conds").innerHTML = CONDS.map(([v,t])=>
    `<button aria-pressed="${cond.has(v)}" title="${t}" data-cond="${esc(v)}">${esc(v)}</button>`).join("");
}

function setAdult(on){
  adult = on;
  document.documentElement.dataset.adult = on ? "1" : "0";
  sel.genre.clear();
  drawChips(); close_(); after(); scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-open],[data-fav],[data-k],[data-cond],[data-car],#reshuffle");
  if (!t) return;
  if (t.id === "reshuffle") return shuffle();
  if (t.dataset.car) { const n = Math.max(1, cur.covers?.length||0);
    ci = (ci + +t.dataset.car + n) % n; return car(); }
  if (t.dataset.open) return open_(t.dataset.open);
  if (t.dataset.fav) {
    await toggleFav(t.dataset.fav);
    document.querySelectorAll(`[data-fav="${t.dataset.fav}"]`)
      .forEach(b=>b.setAttribute("aria-pressed", favs.has(t.dataset.fav)));
    if (cond.has("즐겨찾기")) after();
    return;
  }
  if (t.dataset.cond) {
    const v = t.dataset.cond;
    cond.has(v) ? cond.delete(v) : cond.add(v);
    t.setAttribute("aria-pressed", cond.has(v)); return after();
  }
  const k = t.dataset.k, v = t.dataset.v;
  sel[k].has(v) ? sel[k].delete(v) : sel[k].add(v);
  t.setAttribute("aria-pressed", sel[k].has(v)); after();
});
document.getElementById("scrim").onclick = close_;
document.getElementById("exit19").onclick = () => setAdult(false);
document.getElementById("brand").onclick = () => {
  if (adult) return setAdult(false);
  const pw = prompt("비밀번호");
  if (pw === null) return;
  if (pw === C.adultPassword) setAdult(true);
  else alert("틀렸다");
};
document.getElementById("tbtn").onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme==="dark" ? "light" : "dark";
  localStorage.setItem("theme", r.dataset.theme);
  document.getElementById("tbtn").textContent = r.dataset.theme==="dark" ? "◐" : "◑";
};
document.getElementById("minr").oninput = e => {
  minScore = +e.target.value;
  document.getElementById("mv").textContent = minScore.toFixed(1); after();
};
let qt; document.getElementById("q").oninput = e => {
  clearTimeout(qt); qt = setTimeout(()=>{ query = e.target.value.trim().toLowerCase(); after(); }, 180);
};
document.querySelectorAll("#segView button").forEach((b,i)=> b.onclick = () => {
  view = ["home","feed","random"][i]; slide("segView", i);
  view==="random" ? shuffle() : render();
});
document.querySelectorAll("#segStat button").forEach((b,i)=> b.onclick = () => {
  stat = ["전체","연재중","완결"][i]; slide("segStat", i); after();
});
addEventListener("keydown", e => e.key==="Escape" && close_());
addEventListener("resize", () => {
  slide("segView", ["home","feed","random"].indexOf(view));
  slide("segStat", ["전체","연재중","완결"].indexOf(stat));
});

const saved = localStorage.getItem("theme");
if (saved) { document.documentElement.dataset.theme = saved;
  document.getElementById("tbtn").textContent = saved==="dark" ? "◐" : "◑"; }
paintLogin(); await loadFavs(); drawChips(); render();
const fix = () => { slide("segView",0); slide("segStat",0); };
fix(); if (document.fonts) document.fonts.ready.then(fix);
})();
</script>
</body>
</html>
