name: 주간 화수 갱신

on:
  schedule:
    - cron: "0 19 * * 6"   # 매주 일요일 04:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright
      - run: npx playwright install --with-deps chromium

      - run: node update-episodes.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/webtoons.json
          git diff --cached --quiet || git commit -m "주간 화수 자동 갱신"
          git push
